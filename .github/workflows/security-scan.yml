name: Security Scanning

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
  workflow_call:
# This workflow only reads the repository. Do not add production credentials here.
permissions:
  contents: read

jobs:
  security_gate:
    name: Security Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository and history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          lfs: true
          submodules: recursive
          persist-credentials: false

      - name: Create report directory
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/security-reports"
          echo "REPORT_DIR=$RUNNER_TEMP/security-reports" >> "$GITHUB_ENV"

      - name: Install scanners and report dependencies
        id: install
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clamav clamav-freshclam yara python3-venv curl tar

          # Setup isolated Python virtual environment for Semgrep SAST
          python3 -m venv "$RUNNER_TEMP/security-venv"
          "$RUNNER_TEMP/security-venv/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/security-venv/bin/pip" install semgrep

          # Make binaries immediately available in this step and all subsequent steps
          export PATH="$RUNNER_TEMP/security-venv/bin:/usr/local/bin:$PATH"
          echo "$RUNNER_TEMP/security-venv/bin" >> "$GITHUB_PATH"

          # Verify active scanners exist and print version information
          which semgrep yara clamscan
          semgrep --version
          yara --version
          clamscan --version

      - name: Update ClamAV signatures
        id: clamav_db
        continue-on-error: true
        shell: bash
        run: |
          set +e
          sudo systemctl stop clamav-freshclam.service >/dev/null 2>&1 || true
          if sudo freshclam --quiet; then
            echo "ClamAV database successfully updated."
          else
            echo "::warning::ClamAV database update mirror rate-limited or unavailable. Continuing with bundled signatures."
          fi
          exit 0

      - name: Scan repository with ClamAV
        id: clamav
        continue-on-error: true
        shell: bash
        run: |
          set +e
          # Safe size limits prevent runner memory exhaustion on large codebases
          clamscan -r --infected \
            --max-filesize=25M \
            --max-scansize=100M \
            --log="$REPORT_DIR/clamav.log" \
            --exclude-dir='^(\.git|node_modules|venv|\.venv|dist|build|target|vendor|image_cache)' .
          rc=$?
          echo "$rc" > "$REPORT_DIR/clamav.exit-code"
          # clamscan: 0 = clean, 1 = detection, 2 = operational error.
          exit "$rc"

      - name: Run YARA scan
        id: yara
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          RULES="$RUNNER_TEMP/security-rules.yar"

          # Dynamic string construction prevents workflow from self-matching suspicious patterns
          S_ENC=$(printf '%s%s' '-Encoded' 'Command')
          S_DEC=$(printf '%s%s' 'FromBase' '64String')

          cat > "$RULES" <<RULES
          rule Suspicious_Encoded_PowerShell_Execution {
            meta:
              description = "Potential encoded PowerShell execution; review required"
              severity = "high"
            strings:
              \$encoded = "$S_ENC" ascii wide nocase
              \$decode = "$S_DEC" ascii wide nocase
            condition:
              all of them
          }
          RULES

          set +e
          yara -r "$RULES" . > "$REPORT_DIR/yara.raw.log" 2>&1
          rc=$?

          # Exclude .git and .github paths from detections to prevent false positives on CI configs
          grep -v -E "(\.git/|\.github/)" "$REPORT_DIR/yara.raw.log" > "$REPORT_DIR/yara.log" || true

          if [ "$rc" -ne 0 ] && [ ! -s "$REPORT_DIR/yara.raw.log" ]; then
            echo "$rc" > "$REPORT_DIR/yara.exit-code"
            exit "$rc"
          fi

          if [ -s "$REPORT_DIR/yara.log" ]; then
            echo "1" > "$REPORT_DIR/yara.exit-code"
            exit 1
          else
            echo "0" > "$REPORT_DIR/yara.exit-code"
            exit 0
          fi

      - name: Run Semgrep SAST
        id: semgrep
        continue-on-error: true
        shell: bash
        run: |
          set +e
          semgrep scan --config p/default --json \
            --metrics=off --disable-version-check \
            --exclude='.git' --exclude='node_modules' --exclude='dist' --exclude='vendor' \
            --output "$REPORT_DIR/semgrep.json" .
          rc=$?
          echo "$rc" > "$REPORT_DIR/semgrep.exit-code"
          exit "$rc"

      - name: Generate DOCX, JSON and SARIF reports
        id: reports
        if: always()
        continue-on-error: true
        shell: bash
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          CLAMAV_DB_OUTCOME: ${{ steps.clamav_db.outcome }}
          CLAMAV_OUTCOME: ${{ steps.clamav.outcome }}
          YARA_OUTCOME: ${{ steps.yara.outcome }}
          SEMGREP_OUTCOME: ${{ steps.semgrep.outcome }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, re
          from pathlib import Path
          from datetime import datetime, timezone
          from zipfile import ZipFile, ZIP_DEFLATED
          from xml.sax.saxutils import escape

          out = Path(os.environ["REPORT_DIR"])
          statuses = {
              "installation": os.getenv("INSTALL_OUTCOME", "unknown"),
              "clamav_database_update": os.getenv("CLAMAV_DB_OUTCOME", "unknown"),
              "clamav": os.getenv("CLAMAV_OUTCOME", "unknown"),
              "yara": os.getenv("YARA_OUTCOME", "unknown"),
              "semgrep": os.getenv("SEMGREP_OUTCOME", "unknown"),
          }

          def read_json(name, default):
              try:
                  return json.loads((out / name).read_text())
              except Exception:
                  return default

          semgrep_data = read_json("semgrep.json", {})
          findings = []

          # 1. Parse Semgrep SAST findings
          for item in semgrep_data.get("results", []) if isinstance(semgrep_data, dict) else []:
              extra = item.get("extra", {})
              findings.append({
                  "scanner": "Semgrep", "severity": str(extra.get("severity", "INFO")).upper(),
                  "type": "sast", "file": item.get("path", ""),
                  "line": (item.get("start") or {}).get("line"),
                  "message": extra.get("message", "Semgrep finding")
              })

          # 2. Parse ClamAV log for infected files and scan stats
          clamav_log = out / "clamav.log"
          clamav_scanned_count = 0
          clamav_infected_count = 0
          if clamav_log.exists():
              for line in clamav_log.read_text(errors="ignore").splitlines():
                  line = line.strip()
                  if "Scanned files:" in line:
                      try:
                          clamav_scanned_count = int(line.split(":")[-1].strip())
                      except Exception:
                          pass
                  elif "Infected files:" in line:
                      try:
                          clamav_infected_count = int(line.split(":")[-1].strip())
                      except Exception:
                          pass
                  if " FOUND" in line and not line.startswith("-----------"):
                      parts = line.split(":", 1)
                      file_path = parts[0].strip()
                      virus_desc = parts[1].replace(" FOUND", "").strip() if len(parts) > 1 else "Malware detected"
                      findings.append({
                          "scanner": "ClamAV",
                          "severity": "CRITICAL",
                          "type": "malware",
                          "file": file_path,
                          "line": "-",
                          "message": f"Malware signature match: {virus_desc}"
                      })

          # 3. Parse YARA log for heuristic matches
          yara_log = out / "yara.log"
          yara_match_count = 0
          if yara_log.exists():
              for line in yara_log.read_text(errors="ignore").splitlines():
                  line = line.strip()
                  if line and not line.startswith("error:"):
                      yara_match_count += 1
                      parts = line.split(None, 1)
                      rule_name = parts[0].strip()
                      file_path = parts[1].strip() if len(parts) > 1 else "repository"
                      findings.append({
                          "scanner": "YARA",
                          "severity": "HIGH",
                          "type": "heuristic",
                          "file": file_path,
                          "line": "-",
                          "message": f"Heuristic rule matched: {rule_name}"
                      })

          tracked = subprocess.run(
              ["git", "ls-files"], capture_output=True, text=True, check=False
          )
          tracked_files = tracked.stdout.splitlines() if tracked.returncode == 0 else []

          blocking = []
          for scanner, outcome in statuses.items():
              if scanner == "clamav_database_update":
                  continue  # Freshclam mirror rate limit is non-blocking (bundled signatures active)
              if outcome != "success":
                  blocking.append(f"{scanner} step did not complete successfully")

          # Any non-zero exit code from scanner executions is blocking
          for name in ("clamav", "yara", "semgrep"):
              code_file = out / f"{name}.exit-code"
              if code_file.exists():
                  try:
                      code = int(code_file.read_text().strip())
                      if code != 0:
                          blocking.append(f"{name} returned exit code {code}")
                  except Exception:
                      blocking.append(f"{name} exit code could not be read")

          # Severity-based blocking evaluation
          for finding in findings:
              sev = finding.get("severity", "").upper()
              if sev in ("CRITICAL", "HIGH", "ERROR"):
                  blocking.append(
                      f"{finding['scanner']} {sev} finding: {finding['file']} - {finding['message']}"
                  )

          verdict = "FAIL" if blocking else "PASS"
          report = {
              "schema_version": "1.0",
              "repository": os.getenv("GITHUB_REPOSITORY"),
              "ref": os.getenv("GITHUB_REF"),
              "actor": os.getenv("GITHUB_ACTOR", "unknown"),
              "event_name": os.getenv("GITHUB_EVENT_NAME", "unknown"),
              "commit": os.getenv("GITHUB_SHA"),
              "run_id": os.getenv("GITHUB_RUN_ID"),
              "timestamp_utc": datetime.now(timezone.utc).isoformat(),
              "verdict": verdict,
              "coverage": {
                  "tracked_file_count": len(tracked_files),
                  "git_history_requested": True,
                  "note": "Review scanner logs for unsupported formats, archive limits, submodule and LFS coverage."
              },
              "scanner_status": statuses,
              "findings": findings,
              "blocking_reasons": sorted(set(blocking))
          }
          (out / "security-report.json").write_text(json.dumps(report, indent=2))

          # SARIF 2.1.0 conversion for normalized Semgrep findings
          rules, sarif_results = {}, []
          for item in findings:
              rule_id = f"{item['scanner']}_{item['type']}_{item['severity']}".replace(" ", "_")
              rules[rule_id] = {"id": rule_id, "shortDescription": {"text": item["message"][:200]}}
              result = {
                  "ruleId": rule_id,
                  "level": "error" if item["severity"] in ("CRITICAL", "HIGH", "ERROR") else "warning",
                  "message": {"text": item["message"]},
                  "locations": []
              }
              if item.get("file"):
                  physical = {"artifactLocation": {"uri": item["file"]}}
                  if item.get("line"):
                      physical["region"] = {"startLine": int(item["line"])}
                  result["locations"] = [{"physicalLocation": physical}]
              sarif_results.append(result)

          sarif = {
              "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
              "version": "2.1.0",
              "runs": [{
                  "tool": {"driver": {"name": "Repository Security Scanning", "rules": list(rules.values())}},
                  "results": sarif_results
              }]
          }
          (out / "security-results.sarif").write_text(json.dumps(sarif, indent=2))

          # Professional Executive Word Document Generator (Pure Python Standard Library)
          def sanitize_text(text):
              return re.sub(r'[\x00-\x08\x0b\x0c\x0e-\x1f]', '', str(text))

          def para(text, bold=False, size=22, color="1E293B", align="left", space_before=100, space_after=100, bg=None):
              jc_xml = f'<w:jc w:val="{align}"/>' if align != "left" else ''
              sp_xml = f'<w:spacing w:before="{space_before}" w:after="{space_after}"/>'
              shd_xml = f'<w:shd w:val="clear" w:color="auto" w:fill="{bg}"/>' if bg else ''
              pPr = f'<w:pPr>{jc_xml}{sp_xml}{shd_xml}</w:pPr>'
              b_xml = '<w:b/>' if bold else ''
              clean_t = sanitize_text(text)
              rPr = f'<w:rPr><w:rFonts w:ascii="Segoe UI" w:hAnsi="Segoe UI"/>{b_xml}<w:color w:val="{color}"/><w:sz w:val="{size}"/></w:rPr>'
              return f'<w:p>{pPr}<w:r>{rPr}<w:t xml:space="preserve">{escape(clean_t)}</w:t></w:r></w:p>'

          def cell(text, bold=False, size=19, color="334155", bg="FFFFFF", align="left", width=None):
              w_xml = f'<w:tcW w:w="{width}" w:type="dxa"/>' if width else ''
              shd_xml = f'<w:shd w:val="clear" w:color="auto" w:fill="{bg}"/>'
              tcPr = f'<w:tcPr>{w_xml}{shd_xml}<w:tcMar><w:top w:w="120" w:type="dxa"/><w:bottom w:w="120" w:type="dxa"/><w:left w:w="160" w:type="dxa"/><w:right w:w="160" w:type="dxa"/></w:tcMar></w:tcPr>'
              p = para(text, bold=bold, size=size, color=color, align=align, space_before=40, space_after=40)
              return f'<w:tc>{tcPr}{p}</w:tc>'

          def row(cells):
              return f'<w:tr>{"".join(cells)}</w:tr>'

          def table(rows):
              tblPr = (
                  '<w:tblPr>'
                  '<w:tblW w:w="5000" w:type="pct"/>'
                  '<w:tblBorders>'
                  '<w:top w:val="single" w:sz="4" w:space="0" w:color="CBD5E1"/>'
                  '<w:left w:val="none"/>'
                  '<w:bottom w:val="single" w:sz="6" w:space="0" w:color="94A3B8"/>'
                  '<w:right w:val="none"/>'
                  '<w:insideH w:val="single" w:sz="4" w:space="0" w:color="E2E8F0"/>'
                  '<w:insideV w:val="none"/>'
                  '</w:tblBorders>'
                  '</w:tblPr>'
              )
              return f'<w:tbl>{tblPr}{"".join(rows)}</w:tbl>'

          elements = []

          # Document Title & Subtitle Header
          elements.append(para("SECURITY AUDIT REPORT", bold=True, size=40, color="0F172A", space_before=100, space_after=40))
          elements.append(para("Universal CI/CD Automated Security Gate • Enterprise DevSecOps", bold=False, size=20, color="64748B", space_before=0, space_after=200))

          # Verdict Banner Box
          if verdict == "PASS":
              v_bg, v_col, v_icon, v_sub = "DCFCE7", "166534", "✔ PASS", "All security scanners completed cleanly. Zero blocking threats detected."
          else:
              v_bg, v_col, v_icon, v_sub = "FEE2E2", "991B1B", "✖ FAIL", "One or more blocking security criteria were triggered."

          elements.append(para(f"{v_icon} — FINAL VERDICT: {verdict}", bold=True, size=28, color=v_col, space_before=160, space_after=40, bg=v_bg))
          elements.append(para(v_sub, bold=False, size=18, color=v_col, space_before=0, space_after=160, bg=v_bg))

          # Section 1: Executive & Audit Metadata
          elements.append(para("1. Executive & Audit Metadata", bold=True, size=26, color="1E293B", space_before=300, space_after=100))
          meta_rows = [
              row([cell("Target Repository", bold=True, bg="F8FAFC", width=2800), cell(str(report["repository"]), width=6200)]),
              row([cell("Git Reference / Branch", bold=True, bg="F8FAFC", width=2800), cell(str(report["ref"]), width=6200)]),
              row([cell("Triggered By (Actor)", bold=True, bg="F8FAFC", width=2800), cell(str(report["actor"]), width=6200)]),
              row([cell("Event Type", bold=True, bg="F8FAFC", width=2800), cell(str(report["event_name"]), width=6200)]),
              row([cell("Commit Hash (SHA)", bold=True, bg="F8FAFC", width=2800), cell(str(report["commit"]), width=6200)]),
              row([cell("Scan Timestamp (UTC)", bold=True, bg="F8FAFC", width=2800), cell(str(report["timestamp_utc"]), width=6200)]),
              row([cell("Tracked Files Checked", bold=True, bg="F8FAFC", width=2800), cell(str(report["coverage"]["tracked_file_count"]), width=6200)]),
          ]
          elements.append(table(meta_rows))

          # Section 2: Scanner Execution Summary with dynamic stats
          elements.append(para("2. Scanner Execution Summary", bold=True, size=26, color="1E293B", space_before=300, space_after=100))
          
          clamav_status = statuses.get("clamav", "N/A").upper()
          clamav_col = "166534" if statuses.get("clamav") == "success" and clamav_infected_count == 0 else "991B1B"
          if statuses.get("clamav") == "success":
              clamav_status = f"SUCCESS ({clamav_scanned_count} files, {clamav_infected_count} infected)" if clamav_infected_count == 0 else f"INFECTION DETECTED ({clamav_infected_count} infected)"

          yara_status = statuses.get("yara", "N/A").upper()
          yara_col = "166534" if statuses.get("yara") == "success" and yara_match_count == 0 else "991B1B"
          if statuses.get("yara") == "success":
              yara_status = "SUCCESS (0 matches, Clean)" if yara_match_count == 0 else f"MATCHES FOUND ({yara_match_count} matches)"

          semgrep_status = statuses.get("semgrep", "N/A").upper()
          semgrep_findings_count = len([f for f in findings if f.get("scanner") == "Semgrep"])
          semgrep_col = "166534" if statuses.get("semgrep") == "success" and semgrep_findings_count == 0 else ("991B1B" if any(f.get("severity") in ("CRITICAL", "ERROR") for f in findings if f.get("scanner") == "Semgrep") else "D97706")
          if statuses.get("semgrep") == "success":
              semgrep_status = "SUCCESS (0 findings, Clean)" if semgrep_findings_count == 0 else f"COMPLETED ({semgrep_findings_count} findings)"

          scanner_rows = [
              row([
                  cell("Security Scanner", bold=True, bg="F1F5F9", width=2500),
                  cell("Inspection Scope", bold=True, bg="F1F5F9", width=4200),
                  cell("Status & Results", bold=True, bg="F1F5F9", width=2300, align="center")
              ]),
              row([
                  cell("ClamAV Antivirus", bold=True),
                  cell("Operating System Trojans, Worms & Malware Detection"),
                  cell(clamav_status, bold=True, color=clamav_col, align="center")
              ]),
              row([
                  cell("YARA Heuristics", bold=True),
                  cell("Suspicious Obfuscated Scripts & PowerShell Heuristics"),
                  cell(yara_status, bold=True, color=yara_col, align="center")
              ]),
              row([
                  cell("Semgrep SAST", bold=True),
                  cell("Static Application Security Testing (Code Vulnerabilities)"),
                  cell(semgrep_status, bold=True, color=semgrep_col, align="center")
              ]),
          ]
          elements.append(table(scanner_rows))

          # Section 3: Normalized Findings (Multi-Engine: Semgrep + ClamAV + YARA)
          elements.append(para("3. Normalized Security Findings", bold=True, size=26, color="1E293B", space_before=300, space_after=100))
          if not findings:
              elements.append(para("✔ No security findings or vulnerabilities were reported by the active scanners.", bold=True, size=20, color="166534", bg="F0FDF4", space_before=100, space_after=100))
          else:
              f_rows = [row([cell("Severity", bold=True, bg="F1F5F9", width=1600), cell("Scanner", bold=True, bg="F1F5F9", width=1800), cell("Location", bold=True, bg="F1F5F9", width=2600), cell("Finding Message", bold=True, bg="F1F5F9", width=3000)])]
              for item in findings:
                  sev = item.get("severity", "INFO")
                  s_col = "991B1B" if sev in ("CRITICAL", "ERROR", "HIGH") else "D97706" if sev == "WARNING" else "2563EB"
                  loc = item.get("file", "")
                  line_no = item.get("line")
                  if line_no and str(line_no) != "-":
                      loc = f"{loc}:{line_no}"
                  f_rows.append(row([
                      cell(sev, bold=True, color=s_col),
                      cell(item.get("scanner", "")),
                      cell(loc),
                      cell(item.get("message", ""))
                  ]))
              elements.append(table(f_rows))

          # Section 4: Quality Gate Policy & Blocking Reasons
          elements.append(para("4. Quality Gate Status & Policy Note", bold=True, size=26, color="1E293B", space_before=300, space_after=100))
          if report["blocking_reasons"]:
              for b in report["blocking_reasons"]:
                  elements.append(para(f"• {b}", bold=True, size=20, color="991B1B", space_before=40, space_after=40))
          else:
              elements.append(para("• None. All configured security thresholds and scanner executions completed cleanly.", size=20, color="334155", space_before=40, space_after=40))

          elements.append(para("Notice: PASS indicates that all configured scanners completed without triggering a blocking threshold. It confirms adherence to the automated security gate rules.", size=17, color="64748B", space_before=200, space_after=100))

          body = "".join(elements)
          document_xml = (
              '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
              '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">'
              '<w:body>' + body + '<w:sectPr/></w:body></w:document>'
          )
          content_types = (
              '<?xml version="1.0" encoding="UTF-8"?>'
              '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
              '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
              '<Default Extension="xml" ContentType="application/xml"/>'
              '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>'
              '</Types>'
          )
          rels = (
              '<?xml version="1.0" encoding="UTF-8"?>'
              '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
              '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>'
              '</Relationships>'
          )
          with ZipFile(out / "Security_Audit_Report.docx", "w", ZIP_DEFLATED) as docx:
              docx.writestr("[Content_Types].xml", content_types)
              docx.writestr("_rels/.rels", rels)
              docx.writestr("word/document.xml", document_xml)

          print(f"Security verdict: {verdict}")
          PY

      - name: Upload security artifacts (on PASS and FAIL)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/security-reports/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce strict security gate
        if: always()
        shell: bash
        run: |
          REPORT="$RUNNER_TEMP/security-reports/security-report.json"
          if [ ! -f "$REPORT" ]; then
            echo "Security report missing; blocking the workflow."
            exit 1
          fi
          verdict="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("verdict", "FAIL"))' "$REPORT")"
          if [ "$verdict" != "PASS" ]; then
            echo "Security gate FAILED."
            exit 1
          fi
          echo "Security gate PASSED."
